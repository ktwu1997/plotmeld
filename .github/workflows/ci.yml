name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      QLOO_MODE: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      # Production builds refuse mock Qloo mode (next.config.ts), so CI builds in live mode like production.
      # The build makes no Qloo or Anthropic calls and needs no keys.
      - run: npm run build
        env:
          QLOO_MODE: live
